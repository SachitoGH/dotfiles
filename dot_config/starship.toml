
# ~/.config/starship.toml

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

[directory]
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
