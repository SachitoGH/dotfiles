# Tmux Configuration

# Base Indexing (start from 1 for easier counting)
set -g base-index 1
setw -g pane-base-index 1

#change prefix key
unbind C-b
set-option -g prefix C-space

# Renumber windows automatically after closing
set -g renumber-windows on

# Reduce escape key delay for faster command response
set -s escape-time 0

# Activate mouse support
set -g mouse on

# Reload config file (Prefix + r)
unbind r
bind r source-file ~/.tmux.conf

# --- Pane Management ---
# Custom split keybindings
unbind %
unbind '"'
unbind - # Unbind default delete-buffer to re-use '-' for split
bind | split-window -h -c "#{pane_current_path}" # Horizontal split (Prefix + |)
bind - split-window -v -c "#{pane_current_path}" # Vertical split (Prefix + -)
# Resize panes (Prefix + Shift + H/J/K/L, reduced steps to 3)


unbind c
bind c new-window -c "#{pane_current_path}"
bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 3
bind -r h resize-pane -L 3

# Maximize/restore current pane (Prefix + m)
bind -r m resize-pane -Z

# Kill pane/window without confirmation
unbind x
bind x kill-pane    # Kill current pane (Prefix + x)
unbind &
bind & kill-window # Kill current window (Prefix + &)

# Kill session
unbind X
bind X kill-session

# --- Copy Mode (Vi-style) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Enable focus events (fixes 'autoread' in Neovim)
set-option -g focus-events on

# Enable True Color support (fixes 'termguicolors')
set-option -a terminal-features 'xterm-256color:RGB'

# POPUP WINDOWS
bind g run-shell '\
    POPUP_NAME="popup-$(basename "#{pane_current_path}" | tr -cd "a-zA-Z0-9-")"; \
    if [ "#{session_name}" = "$POPUP_NAME" ]; then \
        tmux detach-client; \
    else \
        tmux display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E "tmux attach-session -t $POPUP_NAME || tmux new-session -s $POPUP_NAME"; \
    fi \
'
# --- Plugins ---
# Initialize Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# List of Tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Navigate between tmux panes and Neovim splits
set -g @plugin 'vaaleyard/tmux-dotbar'          # Visual dot indicator for active window
set -g @tmux-dotbar-position top               # Place dotbar at the top
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX Plugin Manager (KEEP THIS LINE AT THE VERY BOTTOM OF tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
