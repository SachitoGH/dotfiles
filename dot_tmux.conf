# =====================================================
# Prefix & Core
# =====================================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix       # Double-tap prefix to send it through

set -g base-index 1            # Windows start at 1
setw -g pane-base-index 1      # Panes start at 1
set -g renumber-windows on     # Fill gaps when a window is closed
set -s escape-time 5           # Minimal delay — important for Neovim responsiveness
set -g repeat-time 650         # Catch held hjkl without a long delay after release
set -g focus-events on         # Let Neovim autoread work correctly
set -g mouse on
set -g history-limit 50000     # Scrollback per pane (default is only 2000 lines)

# =====================================================
# Terminal & Color (True Color + italics)
# =====================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"  # True color in xterm-compatible terminals
set -s set-clipboard external             # Allow tmux, not inner apps, to use OSC 52

# =====================================================
# Appearance
# =====================================================
# Pane borders (Gruvbox-friendly)
set -g pane-border-style        "fg=colour237"
set -g pane-active-border-style "fg=colour109"

# Selection highlight in copy mode
set -g mode-style "fg=white,bg=colour239"

# Minimal status bar fallback (shown if tmux-dotbar fails to load)
set -g status-position top
set -g status-style "fg=colour244,bg=default"
set -g status-left ""
set -g status-right ""
set -g window-status-current-style "fg=colour109,bold"
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "

# =====================================================
# Keybindings — Windows & Panes
# =====================================================
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Splits that keep current path (more intuitive chars)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane resize (repeatable)
bind -r h resize-pane -L 3
bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 3

# Maximize / restore pane
bind m resize-pane -Z

# Kill without confirmation
bind x kill-pane
bind & kill-window
bind X kill-session

# =====================================================
# Copy Mode (Vi-style)
# =====================================================
setw -g mode-keys vi
setw -g copy-mode-line-numbers hybrid
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle  # block selection
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt

# Clipboard — use the first available platform tool; OSC 52 remains the fallback.
set -s copy-command \
  'if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
   elif command -v win32yank.exe >/dev/null 2>&1; then win32yank.exe -i --crlf; \
   elif command -v wl-copy >/dev/null 2>&1; then wl-copy; \
   elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; \
   elif command -v termux-clipboard-set >/dev/null 2>&1; then termux-clipboard-set; \
   else cat >/dev/null; fi'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# =====================================================
# Popup Terminal (Prefix + g toggles it)
# =====================================================
# Popups inherit $TMUX, so it is unset to allow attaching a client inside the popup.
bind g if -F '#{==:#{session_name},popup}' 'detach-client' \
  'display-popup -xC -yC -w 80% -h 75% -E "env -u TMUX tmux new-session -A -s popup -c \"#{pane_current_path}\""'

# =====================================================
# Plugins (TPM, installed by the chezmoi bootstrap)
# =====================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless pane/split nav with Neovim
set -g @plugin 'vaaleyard/tmux-dotbar'           # Window indicator dots
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-fg-prefix "colour244"
set -g @tmux-dotbar-rounded false                # Plain text; no Nerd Font dependency
set -g @tmux-dotbar-ssh-enabled false            # Keep window names stable and status cheap

# KEEP THIS AT THE VERY BOTTOM
run '~/.tmux/plugins/tpm/tpm'
